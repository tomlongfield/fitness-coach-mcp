# Trimmed, illustrative example — NOT the authoritative install method.
#
# Installing openGym itself is out of scope for this project. This file
# exists only to show the shape of a working setup and, specifically, the
# one thing that has a knock-on effect on this MCP server: whatever host
# port `web` ends up published on (WEB_PORT below) is what you'll point
# OPENGYM_BASE_URL at in the MCP server's .env — either directly (if this
# server is co-located on the same host, see the main README) or via
# whatever reverse proxy sits in front of it.
#
# For the real, current, fully-featured docker-compose.yml (AI coach
# support, media licensing details, etc.) and full install docs, see
# openGym's own repository: https://github.com/DuarteSantos8/openGym

name: opengym

services:
  # One-time download of exercise images/GIFs. See openGym's NOTICE.md for
  # licensing on this media — it's separate from openGym's own AGPL license.
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
        fi
    restart: "no"

  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
    volumes:
      - ./data:/data      # users, passkeys, per-user state — back this up
      - ./coach-auth:/coach-auth

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    # This is the port that matters for the MCP server's OPENGYM_BASE_URL.
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      - RESOLVER=${RESOLVER:-127.0.0.11}
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
