# Example nginx vhost for this MCP server on its own subdomain (Pattern B
# in the main README — one vhost, one catch-all location, no path carving
# needed). This version adds the optional IP-allowlist hardening described
# there: Anthropic's published outbound range for API/register/token/mcp
# traffic, plus your own trusted network for /authorize (the login page,
# loaded by *your* browser, not Anthropic's servers — locking it to
# Anthropic's range instead would lock you out of logging in).
#
# Check https://platform.claude.com/docs/en/api/ip-addresses for the
# current Anthropic range before relying on this long-term.

server {
    server_name mcp.example.com;

    location /authorize {
        allow 203.0.113.0/24;   # your trusted network/VPN CIDR
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The connector's icon — deliberately open, unlike everything else here.
    # Claude resolves a custom connector's icon via a favicon lookup against
    # this domain, done by infrastructure that's neither Anthropic's API
    # range nor your own browser, so it needs to be reachable from anywhere.
    # Static branding images only, nothing account-specific.
    location ~ ^/(favicon\.ico|icon\.svg|icon-512\.png|apple-touch-icon\.png)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        allow 160.79.104.0/21;  # Anthropic's outbound range
        allow 203.0.113.0/24;   # your trusted network/VPN CIDR, for manual testing
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional — only needed if you've set HEALTH_RELAY_SECRET (see README's
    # "HRV via Health Auto Export" section). Narrower than / above: this path
    # has no reason to be reachable from Anthropic's range, only from
    # wherever your phone can reach it.
    location /health-relay/ {
        allow 203.0.113.0/24;   # your trusted network/VPN CIDR
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = mcp.example.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name mcp.example.com;
    return 404;
}
