# Example nginx vhost for openGym on its own subdomain, restricted to a
# trusted network (e.g. a WireGuard/Tailscale range) plus localhost.
#
# The IP allowlist here is the one thing with a knock-on effect on the MCP
# server: if this server runs on the same host as openGym and you point
# OPENGYM_BASE_URL at this public hostname, the MCP server's own outbound
# request will get 403'd by the "deny all" below (it isn't in the
# allowlist, and even adding 127.0.0.1 doesn't reliably help — a same-host
# request to a public hostname can hairpin unpredictably rather than
# actually hitting loopback). The fix isn't more nginx config: point
# OPENGYM_BASE_URL at openGym's internal container/backend port directly
# instead, bypassing this vhost entirely for that one connection. See the
# main README.

server {
    server_name gym.example.com;

    # Only allow your trusted network and local host traffic.
    allow 203.0.113.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;   # openGym's WEB_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gym.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = gym.example.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name gym.example.com;
    return 404;
}
