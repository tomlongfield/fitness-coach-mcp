# Example nginx vhost for SparkyFitness on its own subdomain, restricted to
# a trusted network plus localhost. Same knock-on-effect note as
# opengym.conf applies: if the MCP server is co-located and you point
# SPARKYFITNESS_BASE_URL at this public hostname, its own outbound request
# gets blocked by the allowlist below (or hairpins unreliably). Point
# SPARKYFITNESS_BASE_URL at the internal SPARKY_FITNESS_FRONTEND_PORT
# instead — see the main README.

server {
    server_name tracker.example.com;

    allow 203.0.113.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3004;   # SparkyFitness's frontend port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = tracker.example.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name tracker.example.com;
    return 404;
}
